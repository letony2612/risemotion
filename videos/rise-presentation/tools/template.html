    <script>
      /*@@DATA@@*/
      const tl = gsap.timeline({ paused: true });
      // index-seeded pseudo-random (deterministic)
      const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
      // a sine sway on one property, a pure function of time: nothing ever stands still
      const sway = (sel, prop, amp, period, t0, t1, phase = 0) => {
        const o = { p: 0 };
        const set = () => gsap.set(sel, { [prop]: amp * Math.sin((o.p / period) * Math.PI * 2 + phase) });
        tl.fromTo(o, { p: 0 }, { p: t1 - t0, duration: t1 - t0, ease: "none", onUpdate: set, immediateRender: false }, t0);
      };
      const pop = (sel, t, from = 0.4, ease = "back.out(2.2)", dur = 0.42) =>
        tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: dur, ease }, t);
      const press = (sel, t, to = 0.92) => {
        tl.to(sel, { scale: to, duration: 0.08, ease: "power2.in" }, t);
        tl.to(sel, { scale: 1, duration: 0.35, ease: "back.out(3)" }, t + 0.08);
      };
      const burst = (sel, t, cx, cy, spread = 520, up = 620) => {
        document.querySelectorAll(sel).forEach((el, i) => {
          const a = rnd(i, 3) * Math.PI * 2, v = 0.45 + rnd(i, 5) * 0.55;
          const dx = Math.cos(a) * spread * v, dy = -Math.abs(Math.sin(a)) * up * v - 120;
          tl.set(el, { left: cx, top: cy, backgroundColor: ["#F59E0B", "#FFB547", "#FFD27A", "#1A1714", "#E5484D"][i % 5] }, 0);
          tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: dx * 0.6, y: dy, rotation: rnd(i, 7) * 360, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
          tl.to(el, { x: dx, y: dy + 420, rotation: rnd(i, 9) * 720, opacity: 0, duration: 0.9, ease: "power1.in" }, t + 0.45);
        });
      };
      // a piece of the screen lifts toward the camera; its shadow stays on the glass
      const lift = (card, shadow, t, z = 170, s = 1.06, rx = -5, dur = 0.6) => {
        tl.set(card, { opacity: 1 }, t);
        tl.fromTo(card, { z: 0, scale: 1, rotationX: 0 }, { z, scale: s, rotationX: rx, duration: dur, ease: "back.out(1.7)" }, t);
        tl.fromTo(shadow, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: dur, ease: "power2.out" }, t);
      };

      // ---------------------------------------------------------------- background: the lights drift
      document.querySelectorAll(".bk").forEach((b, i) => {
        sway(b, "x", 26 + rnd(i, 2) * 40, 4 + rnd(i, 4) * 3, 0, D, rnd(i, 6) * 6);
        sway(b, "y", 18 + rnd(i, 3) * 34, 5 + rnd(i, 5) * 3, 0, D, rnd(i, 8) * 6);
      });

      // ================================================================ 1. HOOK: only Sunday
      const days = [...document.querySelectorAll(".day")];
      days.forEach((d, i) =>
        tl.fromTo(d, { y: 70, scale: 0.3, opacity: 0, rotation: (i - 3) * 4 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, E.week_in + i * 0.05));
      sway("#week", "rotation", 1.4, 3.6, 0, E.week_out);
      sway("#week", "y", 10, 2.8, 0, E.week_out, 1.2);
      tl.fromTo("#weekw", { scale: 0.92 }, { scale: 1.02, duration: E.w_dim - 0.1, ease: "sine.inOut" }, 0.1);
      // "dimanche": Sunday lights up, the other days fade
      const lit = (i, t, big = 1.12) => {
        const d = days[i];
        tl.fromTo(d.querySelector(".fill"), { scale: 0 }, { scale: 1, duration: 0.38, ease: "back.out(2.4)" }, t);
        tl.fromTo(d.querySelector(".ck path"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.1);
        tl.to(d, { keyframes: [{ scale: big, y: -14, duration: 0.16, ease: "power2.out" }, { scale: 1, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }] }, t);
        tl.fromTo(d.querySelector(".dl"), { color: "#8C847C" }, { color: "#B45F06", duration: 0.2 }, t);
      };
      lit(6, E.w_dim, 1.22);
      tl.fromTo(days[6].querySelector(".hl"), { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, E.w_dim);
      tl.to(days.slice(0, 6), { scale: 0.9, y: 12, duration: 0.3, ease: "power2.out" }, E.w_dim);

      // ================================================================ 2. AVEC RISE: every day
      // the week steps down to make room for the logo, which lights up on "RISE"
      tl.to("#weekw", { y: 380, scale: 0.94, duration: 0.6, ease: "power3.inOut" }, E.splash2 + 0.05);
      tl.fromTo("#splashw", { y: 40 }, { y: 0, duration: 1.2, ease: "power2.out" }, E.splash2);
      sway("#splash2", "y", 6, 2.4, E.splash2, E.week_out + 0.6);
      // "tous les jours": the six other days light up in a wave, each with its flame
      tl.to(days.slice(0, 6), { scale: 1, y: 0, duration: 0.2, ease: "power2.out" }, E.days - 0.1);
      tl.to(days[6].querySelector(".hl"), { opacity: 0, duration: 0.3 }, E.days);
      for (let i = 0; i < 7; i++) {
        const t = E.days + i * 0.07;
        if (i < 6) lit(i, t, 1.14);
        tl.fromTo(days[i].querySelector(".dfl"), { scale: 0, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "back.out(2.6)" }, t + 0.05);
        sway(days[i].querySelector(".dfl"), "scaleY", 0.06, 0.5 + i * 0.03, t + 0.5, E.week_out + 0.5);
      }
      burst("#confA .conf", E.days + 0.5, 540, 1240, 560, 560);
      // out: the week and the logo rise away, the phone rises into frame
      tl.to("#weekw", { y: -420, scale: 0.8, opacity: 0, duration: 0.36, ease: "power3.in" }, E.phone_in + 0.02);
      tl.to("#splashw", { y: -760, scale: 0.85, opacity: 0, duration: 0.36, ease: "power3.in" }, E.phone_in);

      // ================================================================ THE PHONE (one object, never still)
      sway("#phone", "rotationY", 2.6, 4.2, 0, D);
      sway("#phone", "rotationX", 1.7, 5.3, 0, D, 1.1);
      sway("#phone", "y", 12, 3.6, 0, D, 2.0);
      tl.set("#cam", { y: 1700, rotationX: 42, rotationY: -26, rotation: 6, scale: 0.9 }, 0);
      const push3 = Math.max(E.lift_post - 0.12, E.phone_in + 0.6);
      tl.to("#cam", { y: 40, rotationX: 12, rotationY: -20, rotation: -3, scale: 1.0, duration: push3 - E.phone_in, ease: "expo.out" }, E.phone_in);

      // ================================================================ 3. SHARE: a testimony lifts out
      // the camera follows the post as it rises off the feed
      lift("#lf-sarah", "#sh-sarah", E.lift_post, 190, 1.07, -6);
      tl.to("#cam", { y: -430, rotationX: 9, rotationY: -12, rotation: -1.5, scale: 1.17, duration: 0.85, ease: "power3.inOut" }, push3);
      tl.to("#cam", { y: -470, rotationY: -6, rotation: 0, scale: 1.24, duration: Math.max(0.3, E.pray - 0.1 - push3 - 0.85), ease: "sine.inOut" }, push3 + 0.85);
      // "Dieu ... fait": the line is marked; "ta vie": hearts
      tl.fromTo("#mk-sarah", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, E.w_dieu - 0.05);
      document.querySelectorAll("#hearts .heart").forEach((h, i) => {
        const t = E.w_vie + i * 0.06, dx = (rnd(i, 2) - 0.5) * 160, up = 120 + rnd(i, 4) * 160;
        tl.fromTo(h, { x: 0, y: 0, scale: 0.3, opacity: 0 }, { x: dx * 0.5, y: -up * 0.45, scale: 1.1, opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to(h, { x: dx, y: -up, scale: 0.7, opacity: 0, duration: 0.7, ease: "sine.in" }, t + 0.3);
      });

      // ================================================================ THE APP MOVES ON: one screen per scene
      const swap = (sel, t, dur = 0.42) => tl.fromTo(sel, { x: 600 }, { x: 0, duration: dur, ease: "expo.out" }, t);
      const settle = (card, shadow, t) => {
        tl.to(card, { z: 0, scale: 1, rotationX: 0, duration: 0.28, ease: "power2.in" }, t);
        if (shadow) tl.to(shadow, { opacity: 0, duration: 0.28 }, t);
        tl.set(card, { opacity: 0 }, t + 0.28);
      };
      const shake = (t, amp = 10) => {
        const k = [[1, -0.7], [-0.8, 0.6], [0.6, -0.4], [-0.35, 0.25], [0, 0]];
        k.forEach(([x, y], i) => tl.to("#stage", { x: x * amp, y: y * amp, duration: 0.045, ease: "none" }, t + i * 0.045));
      };
      const floatIn = (sel, t, z, r, dx = 260) => {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { x: dx, z: 0, scale: 0.5, rotation: r * 4 }, { x: 0, z, scale: 1, rotation: r, duration: 0.55, ease: "back.out(1.8)" }, t);
      };

      // ================================================================ 4. PRAY: a hard time, the community prays
      settle("#lf-sarah", "#sh-sarah", E.pray - 0.1);
      swap("#sc-pray", E.pray);
      tl.to("#cam", { y: 60, rotationX: 6, rotationY: 14, rotation: 2, scale: 1.12, duration: 0.6, ease: "power3.inOut" }, E.pray - 0.1);
      lift("#lf-maman", "#sh-maman", E.lift_prayer, 180, 1.06, -5);
      tl.to("#cam", { y: 110, rotationY: 8, rotation: 0.5, scale: 1.18, duration: Math.max(0.6, E.answer - E.pray - 0.6), ease: "sine.inOut" }, E.pray + 0.5);
      // "prient": the button is tapped, little flames rise, the count climbs, the replies come in
      tl.fromTo("#tapM", { scale: 0.3, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, E.jeprie);
      document.querySelectorAll("#mflames .mflame").forEach((f, i) => {
        const t = E.jeprie + 0.08 + i * 0.09, dx = (rnd(i, 2) - 0.5) * 220, h = 160 + rnd(i, 4) * 170;
        tl.fromTo(f, { x: 0, y: 0, scale: 0.4, opacity: 0 }, { x: dx * 0.4, y: -h * 0.35, scale: 1.1, opacity: 1, duration: 0.28, ease: "power2.out" }, t);
        tl.to(f, { x: dx, y: -h, scale: 0.6, opacity: 0, duration: 0.8, ease: "sine.in" }, t + 0.28);
      });
      const praying = { n: 3 };
      tl.fromTo(praying, { n: 3 }, { n: 14, duration: Math.max(0.4, E.answer - E.jeprie - 0.35), ease: "power1.inOut",
        onUpdate: () => { document.getElementById("cnt").textContent = `${Math.round(praying.n)} personnes prient`; } }, E.jeprie + 0.08);
      floatIn("#lf-upd1", E.upd1, 260, -2);
      floatIn("#lf-upd2", E.upd2, 300, 1.5, -260);

      // ================================================================ 5. ANSWERED: "Exaucée", everybody celebrates
      settle("#lf-maman", "#sh-maman", E.answer - 0.1);
      tl.to(["#lf-upd1", "#lf-upd2"], { x: 700, opacity: 0, duration: 0.28, ease: "power3.in" }, Math.max(E.answer - 0.15, E.upd2 + 0.6));
      swap("#sc-answer", E.answer);
      tl.to("#tintMint", { opacity: 1, duration: 0.5, ease: "power1.out" }, E.answer);
      tl.to("#cam", { y: 140, rotationX: 8, rotationY: -12, rotation: -2, scale: 1.1, duration: 0.6, ease: "power3.inOut" }, E.answer - 0.1);
      lift("#lf-answered", "#sh-answered", E.answer + 0.3, 200, 1.06, -4);
      tl.fromTo("#stampB", { scale: 3.2, rotation: -16, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.22, ease: "power4.in" }, E.stamp - 0.22);
      tl.fromTo("#ring5", { scale: 0.3, opacity: 1 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, E.stamp);
      tl.fromTo("#shine5", { xPercent: -130 }, { xPercent: 320, duration: 0.8, ease: "power2.inOut" }, E.stamp + 0.05);
      shake(E.stamp, 9);
      floatIn("#lf-com1", E.celebrate, 280, -3, -300);
      floatIn("#lf-com2", E.celebrate + 0.2, 320, 2.5);
      floatIn("#lf-com3", E.celebrate + 0.4, 360, -1.5, -300);
      burst("#confB .conf", E.celebrate + 0.05, 540, 960, 620, 660);
      tl.to("#cam", { y: 150, rotationY: -6, scale: 1.14, duration: Math.max(0.6, E.groups - E.answer - 0.6), ease: "sine.inOut" }, E.answer + 0.5);

      // ================================================================ 6. GROUPS: each one lifts as it is named
      settle("#lf-answered", "#sh-answered", E.groups - 0.1);
      tl.to(["#lf-com1", "#lf-com2", "#lf-com3"], { x: -900, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, E.groups - 0.2);
      tl.to("#tintMint", { opacity: 0, duration: 0.5 }, E.groups);
      swap("#sc-groups", E.groups);
      tl.to("#cam", { y: -60, rotationX: 10, rotationY: 15, rotation: 1.5, scale: 1.12, duration: 0.6, ease: "power3.inOut" }, E.groups - 0.1);
      const named = (card, shadow, t, next) => {
        lift(card, shadow, t, 150, 1.05, -4, Math.min(0.6, next - 0.05 - t));
        tl.fromTo(card + " .rg", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
        tl.to(card + " .rg", { opacity: 0, duration: 0.15 }, next - 0.05);
        settle(card, shadow, next - 0.05);
      };
      named("#lf-g1", "#sh-g1", E.hl1, E.hl2);
      named("#lf-g2", "#sh-g2", E.hl2, E.hl3);
      named("#lf-g4", "#sh-g4", E.hl3, E.verse - 0.05);
      tl.to("#cam", { y: -110, rotationY: 12, duration: Math.max(0.3, E.hl2 - E.hl1), ease: "sine.inOut" }, E.hl1);
      tl.to("#cam", { y: -200, rotationY: 9, duration: Math.max(0.3, E.hl3 - E.hl2), ease: "sine.inOut" }, E.hl2);
      tl.to("#cam", { y: -250, rotationY: 7, scale: 1.16, duration: Math.max(0.3, E.verse - E.hl3 - 0.15), ease: "sine.inOut" }, E.hl3);

      // ================================================================ 7. VERSE OF THE DAY: sunrise
      swap("#sc-verse", E.verse);
      tl.to("#tintSun", { opacity: 1, duration: 0.9, ease: "power1.out" }, E.verse - 0.1);
      tl.to("#cam", { y: 220, rotationX: 4, rotationY: -10, rotation: -1, scale: 1.08, duration: 0.6, ease: "power3.inOut" }, E.verse - 0.05);
      lift("#lf-verse", "#sh-verse", E.verse_lift, 210, 1.08, -5);
      tl.fromTo("#shine7", { xPercent: -130 }, { xPercent: 320, duration: 1.0, ease: "power2.inOut" }, E.verse_lift + 0.25);
      tl.to("#cam", { y: 330, rotationY: -5, scale: 1.2, duration: Math.max(0.5, E.quiz - E.verse - 0.6), ease: "sine.inOut" }, E.verse + 0.55);

      // ================================================================ 8. QUIZ (the drop)
      settle("#lf-verse", "#sh-verse", E.quiz - 0.12);
      tl.to("#tintSun", { opacity: 0, duration: 0.15 }, E.quiz);
      tl.to("#tintSky", { opacity: 1, duration: 0.15 }, E.quiz);
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, E.quiz);
      swap("#sc-quiz", E.quiz - 0.02, 0.2);
      tl.set(["#lf-ans", "#ans-flat"], { opacity: 1 }, E.quiz - 0.02);  // the answer starts unselected
      tl.fromTo("#ans-sel", { opacity: 0 }, { opacity: 1, duration: 0.06 }, E.q_tap);
      tl.fromTo("#ans-ok", { opacity: 0 }, { opacity: 1, duration: 0.08 }, E.q_ok);
      tl.to("#cam", { y: -40, rotationX: 9, rotationY: 12, rotation: 2, scale: 1.16, duration: 0.45, ease: "back.out(1.6)" }, E.quiz);
      shake(E.quiz, 12);
      tl.fromTo("#tapQ", { scale: 0.3, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, E.q_tap);
      tl.fromTo("#lf-ans", { z: 0, scale: 1 }, { z: 160, scale: 1.05, duration: 0.4, ease: "back.out(2)" }, E.q_tap);
      tl.fromTo("#ex-sheet", { y: 420 }, { y: 0, duration: 0.45, ease: "expo.out" }, E.q_ok + 0.05);
      // "apprendre la Bible": the streak and the levels pop out in front
      tl.set("#lf-stats", { opacity: 1 }, E.learn);
      tl.fromTo("#lf-stats", { z: 0, y: 200, scale: 0.5, rotationX: 30 }, { z: 320, y: 0, scale: 1, rotationX: -4, duration: 0.6, ease: "back.out(1.6)" }, E.learn);
      burst("#confC .conf", E.learn + 0.45, 540, 980, 600, 620);
      tl.to("#cam", { y: 0, rotationY: 6, scale: 1.12, duration: Math.max(0.4, E.end - E.quiz - 0.55), ease: "sine.inOut" }, E.quiz + 0.45);

      // ================================================================ 9. END: the logo, free, the stores
      tl.to("#cam", { y: 1900, rotationX: 40, rotationY: -20, rotation: 8, scale: 0.9, duration: 0.5, ease: "power3.in" }, E.end - 0.05);
      tl.to("#tintSky", { opacity: 0, duration: 0.6 }, E.end);
      sway("#splashw9", "y", 6, 2.6, E.splash9, D);
      burst("#confD .conf", E.free + 0.05, 540, 820, 640, 640);
      tl.fromTo("#slogan9", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, E.free + 0.5);
      tl.fromTo("#stores9 .store", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, E.stores);
      tl.fromTo("#mini1", { y: 800, rotation: -4 }, { y: 0, rotation: -11, duration: 0.9, ease: "expo.out" }, E.stores + 0.2);
      tl.fromTo("#mini2", { y: 800, rotation: 4 }, { y: 0, rotation: 11, duration: 0.9, ease: "expo.out" }, E.stores + 0.32);
      sway("#mini1", "y", 10, 2.8, E.stores + 1.15, D);
      sway("#mini2", "y", 10, 3.2, E.stores + 1.25, D, 1.4);

      // ---------------------------------------------------------------- captions: label, then the punch
      document.querySelectorAll(".beat").forEach((b) => {
        const t0 = parseFloat(b.dataset.start), t1 = t0 + parseFloat(b.dataset.duration);
        const s = b.querySelector(".setup");
        if (s) {
          tl.fromTo(s, { scale: 0.55, y: 26, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t0);
          tl.to(s, { y: -30, opacity: 0, duration: 0.12, ease: "power2.in" }, t1 - 0.12);
        }
        b.querySelectorAll(".punch").forEach((p) => {
          const a = parseFloat(p.dataset.t), u = parseFloat(p.dataset.u);
          tl.fromTo(p, { scale: 0.25, rotation: -5, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.38, ease: "back.out(2.6)" }, a);
          tl.to(p, { scale: 1.035, duration: Math.max(0.2, u - a - 0.55), ease: "sine.inOut" }, a + 0.4);
          tl.to(p, { scale: 0.8, opacity: 0, duration: 0.1, ease: "power2.in" }, u - 0.1);
        });
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
