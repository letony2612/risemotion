      #root.white, #root.white #bg { background: #fff; }

      const tl = gsap.timeline({ paused: true });
      // index-seeded pseudo-random (deterministic)
      const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
      // a sine sway on one property, a pure function of time: nothing ever stands still
      const sway = (sel, prop, amp, period, t0, t1, phase = 0) => {
        const o = { p: 0 };
        const set = () => gsap.set(sel, { [prop]: amp * Math.sin((o.p / period) * Math.PI * 2 + phase) });
        tl.fromTo(o, { p: 0 }, { p: t1 - t0, duration: t1 - t0, ease: "none", onUpdate: set, immediateRender: false }, t0);
      };
      // the Apple-style cut (APPLE): no overshoot anywhere, pieces come out less far, no confetti
      const pop = (k) => (APPLE ? "power3.out" : `back.out(${k})`);
      const LZ = APPLE ? 0.7 : 1;
      const burst = (sel, t, cx, cy, spread = 520, up = 620) => {
        if (APPLE) return;
        document.querySelectorAll(sel).forEach((el, i) => {
          const a = rnd(i, 3) * Math.PI * 2, v = 0.45 + rnd(i, 5) * 0.55;
          const dx = Math.cos(a) * spread * v, dy = -Math.abs(Math.sin(a)) * up * v - 120;
          tl.set(el, { left: cx, top: cy, backgroundColor: ["#F59E0B", "#FFB547", "#FFD27A", "#1A1714", "#E5484D"][i % 5] }, 0);
          tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: dx * 0.6, y: dy, rotation: rnd(i, 7) * 360, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
          tl.to(el, { x: dx, y: dy + 420, rotation: rnd(i, 9) * 720, opacity: 0, duration: 0.9, ease: "power1.in" }, t + 0.45);
        });
      };
      // a piece of the screen lifts toward the camera; its shadow stays on the glass
      const lift = (card, shadow, t, z = 170, s = 1.06, rx = -5, dur = 0.6) => {
        tl.set(card, { opacity: 1 }, t);
        tl.fromTo(card, { z: 0, scale: 1, rotationX: 0 }, { z: z * LZ, scale: 1 + (s - 1) * LZ, rotationX: rx * LZ, duration: dur, ease: pop(1.7) }, t);
        if (shadow) tl.fromTo(shadow, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: dur, ease: "power2.out" }, t);
      };
      // a second lift of the same piece starts from where settle() left it
      const relift = (card, shadow, t, z = 170, s = 1.06, rx = -5, dur = 0.45) => {
        tl.set(card, { opacity: 1 }, t);
        tl.to(card, { z: z * LZ, scale: 1 + (s - 1) * LZ, rotationX: rx * LZ, duration: dur, ease: pop(1.7) }, t);
        if (shadow) tl.to(shadow, { opacity: 1, scale: 1.04, duration: dur, ease: "power2.out" }, t);
      };
      const settle = (card, shadow, t) => {
        tl.to(card, { z: 0, scale: 1, rotationX: 0, duration: 0.28, ease: "power2.in" }, t);
        if (shadow) tl.to(shadow, { opacity: 0, duration: 0.28 }, t);
        tl.set(card, { opacity: 0 }, t + 0.28);
      };
      // a card of the app floats out beside the phone, and later leaves
      const floatIn = (sel, t, z, r, dx = 260) => {
        if (!APPLE) tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { x: APPLE ? dx * 0.45 : dx, z: 0, scale: APPLE ? 0.82 : 0.5, rotation: r * (APPLE ? 1.5 : 4), ...(APPLE ? { opacity: 0 } : {}) },
          { x: 0, z: z * LZ, scale: 1, rotation: APPLE ? r * 0.5 : r, ...(APPLE ? { opacity: 1 } : {}), duration: 0.55, ease: pop(1.8) }, t);
      };
      const floatOut = (sels, t, dx = -900) => tl.to(sels, { x: dx, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, t);
      // a touch: an amber ring, or in the Apple cut the grey disc of a screen recording
      const tap = (sel, t) => tl.fromTo(sel, { scale: APPLE ? 0.5 : 0.3, opacity: 1 },
        { scale: APPLE ? 1.25 : 1.9, opacity: 0, duration: APPLE ? 0.45 : 0.5, ease: "power2.out", immediateRender: false }, t);
      const swap = (sel, t, dur = 0.42) => tl.fromTo(sel, { x: 600 }, { x: 0, duration: APPLE ? dur * 1.3 : dur, ease: "expo.out" }, t);
      const shake = (t, amp = 10) => {
        if (APPLE) return;
        const k = [[1, -0.7], [-0.8, 0.6], [0.6, -0.4], [-0.35, 0.25], [0, 0]];
        k.forEach(([x, y], i) => tl.to("#stage", { x: x * amp, y: y * amp, duration: 0.045, ease: "none" }, t + i * 0.045));
      };
      const cam = (t, dur, pose, ease = "power3.inOut") => tl.to("#cam", { ...pose, duration: Math.max(0.2, dur), ease }, t);

      // ---------------------------------------------------------------- background: the lights drift
      document.querySelectorAll(".bk").forEach((b, i) => {
        sway(b, "x", 26 + rnd(i, 2) * 40, 4 + rnd(i, 4) * 3, 0, D, rnd(i, 6) * 6);
        sway(b, "y", 18 + rnd(i, 3) * 34, 5 + rnd(i, 5) * 3, 0, D, rnd(i, 8) * 6);
      });

      // ================================================================ 1. HOOK: the app from the first frame
      // on each phrase a card of the app comes out of the phone toward us; the next one swipes it away
      // (the new card lands on top of the old one, which slides away whole: no two half-faded cards)
      const hookCard = (sel, t, tOut, r, last = false) => {
        const w = sel.replace("#ic-", "#w-");
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, t);
        tl.fromTo(sel, { y: 340, scale: 0.5, rotationX: 38, rotationY: 0, rotation: 0 },
          { y: 0, scale: 1, rotationX: 5, rotationY: r * 2.5, rotation: r, duration: 0.6, ease: pop(1.5) }, t);
        tl.to(sel, last ? { y: 1100, rotationX: 30, duration: 0.5, ease: "power3.in" }
          : { x: -1100, rotationY: -40, rotation: r - 6, ...(APPLE ? { filter: "blur(6px)" } : {}), duration: 0.34, ease: "power3.in" }, tOut);
        tl.set(sel, { opacity: 0 }, tOut + 0.5);  // off the frame: hidden, not parked
        sway(w, "y", 10, 2.8, t, tOut + 0.5, 0.8);
      };
      hookCard("#ic-composer", E.c_share - 0.05, E.c_meet - 0.14, -3);
      hookCard("#ic-messages", E.c_meet - 0.05, E.c_grow - 0.14, 3);
      hookCard("#ic-stats", E.c_grow - 0.05, E.intro_back, -2, true);
      // "Et si je te présentais": the phone dips out of the frame (below), the logo lights up on "RISE"
      tl.fromTo("#splashw", { scale: 0.92 }, { scale: 1.04, duration: Math.max(0.5, E.phone_in - E.splash2), ease: "sine.out" }, E.splash2);
      // out: the phone comes back up and pushes the logo away
      tl.to("#splashw", { y: -800, scale: 0.85, opacity: 0, duration: 0.38, ease: "power3.in" }, E.phone_in);

      // ================================================================ THE PHONE (one object, never still)
      sway("#phone", "rotationY", 2.6, 4.2, 0, D);
      sway("#phone", "rotationX", 1.7, 5.3, 0, D, 1.1);
      sway("#phone", "y", 12, 3.6, 0, D, 2.0);
      // the hook: on the first frame the phone is already there, low in the frame, swinging up into place
      tl.set("#cam", { y: 560, rotationX: 30, rotationY: -26, rotation: 6, scale: 0.84 }, 0);
      cam(0, 1.15, { y: 260, rotationX: 14, rotationY: -12, rotation: 2, scale: 0.92 }, "power3.out");
      cam(1.15, E.intro_back - 1.2, { y: 230, rotationX: 10, rotationY: 10, rotation: -1.5, scale: 0.95 }, "sine.inOut");
      cam(E.intro_back, 0.6, { y: 1700, rotationX: 42, rotationY: -26, rotation: 6, scale: 0.9 }, "power3.in");
      // then it rises again for the tour
      cam(E.phone_in, 0.9, { y: 40, rotationX: 12, rotationY: -18, rotation: -3, scale: 1.0 }, "expo.out");
      cam(E.phone_in + 0.9, E.q_feed - E.phone_in - 1.0, { y: 20, rotationY: -12, rotation: -1.5, scale: 1.04 }, "sine.inOut");

      // ================================================================ 2. FEED: a question, a testimony, a reflection
      lift("#lf-prompt", "#sh-prompt", E.q_feed - 0.05, 170, 1.08, -6);
      settle("#lf-prompt", "#sh-prompt", E.t_feed - 0.1);
      lift("#lf-sarah", "#sh-sarah", E.t_feed - 0.05, 190, 1.07, -6);
      cam(E.t_feed - 0.15, 0.8, { y: -400, rotationX: 9, rotationY: -10, rotation: -1, scale: 1.12 });
      floatIn("#lf-verset", E.r_feed - 0.05, 300, 3, 300);
      // "et on s'encourage dans la foi": hearts on the testimony, the comments fly out, confetti
      if (!APPLE) document.querySelectorAll("#hearts .heart").forEach((h, i) => {
        const t = E.enc + i * 0.06, dx = (rnd(i, 2) - 0.5) * 160, up = 120 + rnd(i, 4) * 160;
        tl.fromTo(h, { x: 0, y: 0, scale: 0.3, opacity: 0 }, { x: dx * 0.5, y: -up * 0.45, scale: 1.1, opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to(h, { x: dx, y: -up, scale: 0.7, opacity: 0, duration: 0.7, ease: "sine.in" }, t + 0.3);
      });
      floatOut("#lf-verset", E.enc - 0.1, 700);
      floatIn("#lf-com1", E.enc + 0.05, 280, -3, -300);
      floatIn("#lf-com2", E.enc + 0.3, 320, 2.5);
      floatIn("#lf-com3", E.enc + 0.55, 360, -1.5, -300);
      burst("#confA .conf", E.enc + 0.1, 540, 1150, 600, 640);
      cam(E.t_feed + 0.65, E.groups_tap - E.t_feed - 0.85, { y: -430, rotationY: -5, rotation: 0, scale: 1.16 }, "sine.inOut");

      // ================================================================ 3. GROUPS: the tab, the groups, their members
      floatOut(["#lf-com1", "#lf-com2", "#lf-com3"], E.groups_tap - 0.45);
      settle("#lf-sarah", null, E.groups_tap - 0.3);
      tl.to("#sh-sarah", { opacity: 0, duration: 0.25 }, E.groups_tap - 0.3);
      tap("#tapG", E.groups_tap);
      swap("#sc-groups", E.groups);
      cam(E.groups - 0.05, 0.6, { y: -40, rotationX: 10, rotationY: 15, rotation: 1.5, scale: 1.1 });
      const rows = [["#lf-g1", "#sh-g1"], ["#lf-g2", "#sh-g2"], ["#lf-g3", "#sh-g3"], ["#lf-g4", "#sh-g4"]];
      rows.forEach(([c, s], i) => {
        lift(c, s, E.rows + i * 0.1, 130, 1.04, -4, 0.45);
        tl.fromTo(c + " .rg", { opacity: 0 }, { opacity: 1, duration: 0.15 }, E.rows + i * 0.1);
        const down = Math.max(E.chat - 0.1 + i * 0.05, E.rows + i * 0.1 + 0.46);  // never before its own lift is done
        tl.to(c + " .rg", { opacity: 0, duration: 0.15 }, down);
        settle(c, s, down);
      });
      // "avec des chrétiens qui ont les mêmes passions que toi": the group talks
      // one message per beat; the last one lands before the prayer tab is tapped
      const talk = Math.max(0.3, Math.min((E.chat_end - E.chat) / 4, (E.pray_tap - 0.76 - E.chat) / 3));
      floatIn("#lf-ch1", E.chat, 260, -2, -280);
      floatIn("#lf-ch2", E.chat + talk, 300, 1.5, -280);
      floatIn("#lf-ch3", E.chat + talk * 2, 340, -1.5, 280);
      floatIn("#lf-ch4", E.chat + talk * 3, 380, 2, -280);
      cam(E.groups + 0.55, E.pray_tap - E.groups - 0.75, { y: -20, rotationY: 9, rotation: 0.5, scale: 1.12 }, "sine.inOut");

      // ================================================================ 4. PRAYER: carrying one another
      floatOut(["#lf-ch1", "#lf-ch2", "#lf-ch3", "#lf-ch4"], E.pray_tap - 0.2);
      tap("#tapP", E.pray_tap);
      swap("#sc-pray", E.pray);
      cam(E.pray - 0.05, 0.6, { y: 60, rotationX: 6, rotationY: -14, rotation: -2, scale: 1.12 });
      lift("#lf-maman", "#sh-maman", E.lift_prayer, 180, 1.06, -5);
      // "partage tes sujets de prière": the request sheet slides up, "Confier ma prière"
      settle("#lf-maman", "#sh-maman", E.sheet_up - 0.3);
      tl.fromTo("#dimS", { opacity: 0 }, { opacity: 1, duration: 0.3 }, E.sheet_up - 0.05);
      tl.fromTo("#sheet", { y: 960 }, { y: 0, duration: 0.5, ease: "expo.out" }, E.sheet_up - 0.05);
      tap("#tapC", E.confier);
      tl.to("#sheet", { y: 960, duration: 0.35, ease: "power3.in" }, E.jeprie - 0.4);
      tl.to("#dimS", { opacity: 0, duration: 0.3 }, E.jeprie - 0.3);
      // "prie pour ceux des autres": the request lifts again, its button is tapped, the count climbs
      relift("#lf-maman", "#sh-maman", E.jeprie - 0.05, 180, 1.06, -5);
      tl.fromTo("#tapM", { scale: 0.3, opacity: 1 }, { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, E.jeprie + 0.2);
      if (!APPLE) document.querySelectorAll("#mflames .mflame").forEach((f, i) => {
        const t = E.jeprie + 0.25 + i * 0.09, dx = (rnd(i, 2) - 0.5) * 220, h = 160 + rnd(i, 4) * 170;
        tl.fromTo(f, { x: 0, y: 0, scale: 0.4, opacity: 0 }, { x: dx * 0.4, y: -h * 0.35, scale: 1.1, opacity: 1, duration: 0.28, ease: "power2.out" }, t);
        tl.to(f, { x: dx, y: -h, scale: 0.6, opacity: 0, duration: 0.8, ease: "sine.in" }, t + 0.28);
      });
      const praying = { n: 3 };
      tl.fromTo(praying, { n: 3 }, { n: 14, duration: Math.max(0.5, E.upd1 - E.jeprie), ease: "power1.inOut",
        onUpdate: () => { document.getElementById("cnt").textContent = `${Math.round(praying.n)} ${PRAYING}`; } }, E.jeprie + 0.25);
      // "on n'est pas appelés à avancer seuls": the replies come in, the light warms
      floatIn("#lf-upd1", E.upd1, 260, -2);
      floatIn("#lf-upd2", E.upd2, 300, 1.5, -260);
      tl.to("#tintMint", { opacity: 1, duration: 0.6, ease: "power1.out" }, E.upd1);
      cam(E.pray + 0.55, E.upd1 - E.pray - 0.6, { y: 110, rotationY: -8, rotation: -0.5, scale: 1.16 }, "sine.inOut");
      // the tab bar comes back into view for the next tap
      cam(E.upd1 + 0.05, E.explore_tap - E.upd1 - 0.1, { y: -60, rotationY: -6, rotation: 0, scale: 1.08 }, "sine.inOut");

      // ================================================================ 5. EXPLORER, THEN THE QUIZ (the drop)
      settle("#lf-maman", "#sh-maman", E.explore_tap - 0.3);
      floatOut(["#lf-upd1", "#lf-upd2"], E.explore_tap - 0.3, 800);
      tl.to("#tintMint", { opacity: 0, duration: 0.5 }, E.explore_tap);
      tap("#tapE", E.explore_tap);
      swap("#sc-explore", E.verse);
      tl.to("#tintSun", { opacity: 1, duration: 0.8, ease: "power1.out" }, E.verse);
      cam(E.verse - 0.05, 0.6, { y: 220, rotationX: 4, rotationY: -10, rotation: -1, scale: 1.08 });
      lift("#lf-verse", "#sh-verse", E.verse_lift, 210, 1.08, -5, Math.min(0.6, E.quiz - 0.25 - E.verse_lift));
      tl.fromTo("#shine7", { xPercent: -130 }, { xPercent: 320, duration: 0.9, ease: "power2.inOut" }, E.verse_lift + 0.1);
      settle("#lf-verse", "#sh-verse", E.quiz - 0.25);
      // "teste": Jouer, the music drops, the question
      tap("#tapJ", E.quiz - 0.08);
      tl.fromTo("#tapJd", { scale: 0.4, opacity: 0.9 }, { scale: 1.2, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, E.quiz - 0.08);
      tl.to("#tintSun", { opacity: 0, duration: 0.15 }, E.quiz);
      tl.to("#tintSky", { opacity: 1, duration: 0.15 }, E.quiz);
      if (!APPLE) tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, E.quiz);
      swap("#sc-quiz", E.quiz - 0.02, 0.2);
      tl.set(["#lf-ans", "#ans-flat"], { opacity: 1 }, E.quiz - 0.02);  // the answer starts unselected
      tl.fromTo("#ans-sel", { opacity: 0 }, { opacity: 1, duration: 0.06 }, E.q_tap);
      tl.fromTo("#ans-ok", { opacity: 0 }, { opacity: 1, duration: 0.08 }, E.q_ok);
      cam(E.quiz, 0.45, { y: -40, rotationX: 9, rotationY: 12, rotation: 2, scale: 1.16 }, APPLE ? "expo.out" : "back.out(1.6)");
      shake(E.quiz, 12);
      tap("#tapQ", E.q_tap);
      tl.fromTo("#lf-ans", { z: 0, scale: 1 }, { z: 160 * LZ, scale: 1 + 0.05 * LZ, duration: 0.4, ease: pop(2) }, E.q_tap);
      // "et découvre la Bible autrement": the answer explained, confetti
      tl.fromTo("#ex-sheet", { y: 420 }, { y: 0, duration: 0.45, ease: "expo.out" }, E.learn);
      burst("#confB .conf", E.learn + 0.1, 540, 980, 600, 620);
      cam(E.quiz + 0.45, E.end - E.quiz - 0.5, { y: 0, rotationY: 6, scale: 1.12 }, "sine.inOut");

      // ================================================================ 6. RECAP: sharing, exchanging, praying, learning
      cam(E.end - 0.05, 0.5, { y: 1900, rotationX: 40, rotationY: -20, rotation: 8, scale: 0.9 }, "power3.in");
      tl.to("#tintSky", { opacity: 0, duration: 0.6 }, E.end);
      [["#m1", E.v1, -6], ["#m2", E.v2, 5], ["#m3", E.v3, -4], ["#m4", E.v4, 6]].forEach(([id, t, r]) => {
        tl.fromTo(id, { opacity: 0, scale: APPLE ? 0.7 : 0.3, y: 120, rotation: r * (APPLE ? 1.5 : 3) }, { opacity: 1, scale: 0.86, y: 0, rotation: r, duration: 0.5, ease: pop(2) }, t - 0.05);
        tl.to(id, { rotation: 0, scale: 1, duration: 0.6, ease: "power2.inOut" }, E.together);
      });
      // "et grandir ensemble": they gather into a fan at the bottom, the logo takes the centre
      const fan = [[-330, 760, -16], [-110, 830, -5], [110, 830, 5], [330, 760, 16]];
      ["#wm1", "#wm2", "#wm3", "#wm4"].forEach((id, i) => {
        const home = [[200, 560], [580, 560], [200, 1250], [580, 1250]][i];
        const [dx, ty, r] = fan[i];
        tl.to(id, { x: 390 + dx - home[0], y: 520 + ty - home[1], rotation: r, scale: 0.72, duration: 0.7, ease: "power3.inOut" }, E.together + i * 0.04);
      });
      tl.fromTo("#splashw9", { scale: 0.92 }, { scale: 1.04, duration: Math.max(0.5, D - E.splash9), ease: "sine.out" }, E.splash9);
      tl.set("#logo9", { opacity: 1 }, E.splash9 + 5.4);  // under the clip's last frames, so the hand-off is seamless
      tl.fromTo("#slogan9", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, E.w_rise9 + 0.7);
      burst("#confD .conf", E.w_rise9 + 0.05, 540, 760, 640, 640);
      tl.fromTo("#st-app", { scale: APPLE ? 0.85 : 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: pop(2.2) }, E.appstore - 0.05);
      tl.fromTo("#st-play", { scale: APPLE ? 0.85 : 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: pop(2.2) }, E.gplay - 0.05);
      ["#m1", "#m2", "#m3", "#m4"].forEach((id, i) => sway(id, "y", 8, 2.6 + i * 0.3, E.together + 0.9, D, i));

      // ---------------------------------------------------------------- captions: label, then the punch
      // (the Apple cut: the words rise into focus and leave by blurring away, nothing bounces)
      document.querySelectorAll(".beat").forEach((b) => {
        const t0 = parseFloat(b.dataset.start), t1 = t0 + parseFloat(b.dataset.duration);
        const s = b.querySelector(".setup");
        if (s) {
          // the hook types its lead-in word by word, on the voice (in the Apple cut, words alone, no label behind)
          const words = s.querySelectorAll(".w");
          if (!(APPLE && words.length))
            tl.fromTo(s, APPLE ? { y: 22, opacity: 0, filter: "blur(10px)" } : { scale: 0.55, y: 26, opacity: 0 },
              APPLE ? { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" } : { scale: 1, y: 0, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t0);
          words.forEach((w) => tl.fromTo(w, APPLE ? { y: 18, opacity: 0, filter: "blur(8px)" } : { y: 22, scale: 0.6, opacity: 0 },
            APPLE ? { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" } : { y: 0, scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.6)" },
            parseFloat(w.dataset.t)));
          tl.to(s, APPLE ? { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power1.in" } : { y: -30, opacity: 0, duration: 0.12, ease: "power2.in" }, t1 - (APPLE ? 0.16 : 0.12));
        }
        b.querySelectorAll(".punch").forEach((p) => {
          const a = parseFloat(p.dataset.t), u = parseFloat(p.dataset.u);
          tl.fromTo(p, APPLE ? { y: 46, opacity: 0, filter: "blur(16px)" } : { scale: 0.25, rotation: -5, opacity: 0 },
            APPLE ? { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.38, ease: "power3.out" } : { scale: 1, rotation: 0, opacity: 1, duration: 0.38, ease: "back.out(2.6)" }, a);
          tl.to(p, { scale: APPLE ? 1.02 : 1.035, duration: Math.max(0.12, u - a - 0.55), ease: "sine.inOut" }, a + 0.4);
          tl.to(p, APPLE ? { opacity: 0, filter: "blur(10px)", duration: 0.1, ease: "power1.in" } : { scale: 0.8, opacity: 0, duration: 0.1, ease: "power2.in" }, u - 0.1);
        });
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
