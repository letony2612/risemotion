<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by tools/build.py from tools/template.html: edit the template, then rebuild. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }

      :root {
        --ink: #1a1714; --paper: #faf8f5; --cream: #fff8ee; --amber: #f59e0b; --amber-hi: #ffb547;
        --amber-lo: #ec8607; --edge: #c25e0c; --grey: #8c847c; --line: #ece6df;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--cream); color: var(--ink); font-family: "Inter", sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* ---------- background: warm light, out-of-focus lights drifting ---------- */
      #bg { background: linear-gradient(180deg, #fffaf3 0%, #fff2e0 55%, #ffe7c9 100%); }
      .bk { position: absolute; display: block; border-radius: 50%; }

      /* ---------- 1-2. the week ---------- */
      #week { position: absolute; left: 36px; top: 850px; width: 1008px; height: 210px; display: flex; gap: 12px; }
      .day { position: relative; display: block; width: 134px; height: 210px; border-radius: 34px; background: #fff;
        box-shadow: 0 20px 40px rgba(140, 90, 30, 0.13), 0 4px 10px rgba(140, 90, 30, 0.06); }
      .day .hl { position: absolute; inset: -4px; border-radius: 36px; border: 5px solid var(--amber); opacity: 0;
        box-shadow: 0 0 40px rgba(245, 158, 11, 0.45); }
      .dl { position: absolute; left: 0; top: 28px; width: 134px; text-align: center; font-weight: 800; font-size: 48px; line-height: 1; color: var(--grey); }
      .dc { position: absolute; left: 28px; top: 100px; width: 78px; height: 78px; border-radius: 50%; border: 5px solid var(--line); background: #faf7f3; }
      .fill { position: absolute; left: -5px; top: -5px; width: 78px; height: 78px; border-radius: 50%;
        background: linear-gradient(160deg, var(--amber-hi), var(--amber-lo)); box-shadow: 0 8px 18px rgba(236, 134, 7, 0.4); }
      .ck { position: absolute; left: 14px; top: 16px; width: 40px; height: 36px; overflow: visible; }
      .dfl { position: absolute; left: 44px; top: -60px; width: 46px; height: 57px; display: block; }
      #splashw { position: absolute; left: 156px; top: 452px; width: 768px; height: 400px; }
      #splash2 { position: absolute; left: 0; top: 0; width: 768px; height: 400px; display: block; }

      /* ---------- the phone (a 3D object, held by the camera) ---------- */
      #stage { perspective: 2600px; perspective-origin: 540px 1000px; }
      #cam { transform-style: preserve-3d; transform-origin: 540px 1204px; }
      #phone { position: absolute; left: 222px; top: 520px; width: 636px; height: 1369px; transform-style: preserve-3d; transform-origin: 318px 684px; }
      #phone .frame { position: absolute; left: 0; top: 0; width: 636px; height: 1369px; border-radius: 92px; background: var(--ink);
        box-shadow: 0 70px 120px rgba(90, 55, 20, 0.26), 0 18px 36px rgba(90, 55, 20, 0.14), inset 0 0 0 3px #3a332c; }
      #phone .screen { position: absolute; left: 18px; top: 18px; width: 600px; height: 1333px; border-radius: 74px; overflow: hidden; background: var(--paper); }
      .scr { position: absolute; left: 0; top: 0; width: 600px; height: 1333px; display: block; }
      .lsh { position: absolute; display: block; border-radius: 30px; background: rgba(70, 40, 10, 0.3); opacity: 0; filter: blur(26px); }
      .lift { position: absolute; display: block; transform-style: preserve-3d; opacity: 0; }
      .lift .card { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 22px; overflow: hidden; background: var(--paper);
        box-shadow: 0 2px 0 rgba(255, 255, 255, 0.9) inset, 0 0 0 2px rgba(255, 255, 255, 0.95); }
      .lift .card img { display: block; width: 100%; height: 100%; }
      .mark { position: absolute; display: block; border-radius: 6px; background: rgba(255, 186, 60, 0.55); mix-blend-mode: multiply; transform-origin: 0 50%; }
      .heart { position: absolute; display: block; width: 34px; height: 34px; opacity: 0; }
      .heart svg { display: block; width: 100%; height: 100%; }

      /* ---------- confetti ---------- */
      .conf { position: absolute; display: block; width: 14px; height: 22px; border-radius: 3px; opacity: 0; }

      /* ---------- captions: setup label + punch line ---------- */
      .beat { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; }
      .row { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; }
      .row.s { top: 196px; }
      .row.p { top: 292px; }
      .setup { display: block; padding: 14px 30px 16px; border-radius: 22px; background: #fff; white-space: nowrap;
        font-weight: 700; font-size: 46px; line-height: 1.15; color: var(--ink); letter-spacing: -0.01em;
        box-shadow: 0 12px 30px rgba(120, 70, 20, 0.14), 0 2px 6px rgba(120, 70, 20, 0.08); }
      .setup b { font-weight: 800; }
      .punch { display: block; max-width: 980px; padding: 16px 34px 20px; border-radius: 28px; text-align: center;
        background: linear-gradient(180deg, #db7a07 0%, #d27105 100%);
        font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -0.015em; text-transform: uppercase; color: #fff;
        text-shadow: 0 4px 0 rgba(140, 62, 0, 0.35);
        box-shadow: 0 10px 0 #a24f03, 0 26px 46px rgba(162, 79, 3, 0.3); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="@@DURATION@@" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="heartShape" viewBox="0 0 24 24"><path fill="#E5484D" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 4.3 2.4.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" /></symbol>
      </svg>

      <div id="bg" class="layer"></div>
      <div id="bokeh" class="layer">@@BOKEH@@</div>

      <!-- ===================== 1-2. THE WEEK, THEN RISE ===================== -->
      <div id="weekw" class="layer">
        <div id="week">@@WEEK@@</div>
      </div>
      <div id="splashw">
        <video id="splash2" class="clip" src="assets/brand/rise_splash_light.webm" muted playsinline data-start="@@SPLASH2_START@@" data-duration="@@SPLASH2_DUR@@" data-track-index="3"></video>
      </div>

      <!-- ===================== THE PHONE ===================== -->
      <div id="stage" class="layer">
        <div id="cam" class="layer">
          <div id="phone">
            <span class="frame"></span>
            <div class="screen">
              <img id="sc-feed" class="scr" src="assets/screens/02_accueil.png" alt="" />
              <span id="sh-sarah" class="lsh" style="@@SPOS:post_sarah@@"></span>
            </div>
            <!-- 3. share: Sarah's testimony lifts out -->
            <div id="lf-sarah" class="lift" style="@@POS:post_sarah@@">
              <div class="card"><img src="assets/lift/post_sarah.png" alt="" /></div>
              <span id="mk-sarah" class="mark" style="left: 236px; top: 80px; width: 182px; height: 29px"></span>
              <div id="hearts">@@HEARTS@@</div>
            </div>
          </div>
        </div>
      </div>

      <div id="confA" class="layer">@@CONFETTI@@</div>

      <!-- captions: a setup label, then the punch line on its first word -->
@@BEATS@@

      <!-- audio: voice-over lines, music bed, sound design -->
@@AUDIO@@
    </div>

    <script>
      /*@@DATA@@*/
      const tl = gsap.timeline({ paused: true });
      // index-seeded pseudo-random (deterministic)
      const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
      // a sine sway on one property, a pure function of time: nothing ever stands still
      const sway = (sel, prop, amp, period, t0, t1, phase = 0) => {
        const o = { p: 0 };
        const set = () => gsap.set(sel, { [prop]: amp * Math.sin((o.p / period) * Math.PI * 2 + phase) });
        tl.fromTo(o, { p: 0 }, { p: t1 - t0, duration: t1 - t0, ease: "none", onUpdate: set, immediateRender: false }, t0);
      };
      const pop = (sel, t, from = 0.4, ease = "back.out(2.2)", dur = 0.42) =>
        tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: dur, ease }, t);
      const press = (sel, t, to = 0.92) => {
        tl.to(sel, { scale: to, duration: 0.08, ease: "power2.in" }, t);
        tl.to(sel, { scale: 1, duration: 0.35, ease: "back.out(3)" }, t + 0.08);
      };
      const burst = (sel, t, cx, cy, spread = 520, up = 620) => {
        document.querySelectorAll(sel).forEach((el, i) => {
          const a = rnd(i, 3) * Math.PI * 2, v = 0.45 + rnd(i, 5) * 0.55;
          const dx = Math.cos(a) * spread * v, dy = -Math.abs(Math.sin(a)) * up * v - 120;
          tl.set(el, { left: cx, top: cy, backgroundColor: ["#F59E0B", "#FFB547", "#FFD27A", "#1A1714", "#E5484D"][i % 5] }, 0);
          tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: dx * 0.6, y: dy, rotation: rnd(i, 7) * 360, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
          tl.to(el, { x: dx, y: dy + 420, rotation: rnd(i, 9) * 720, opacity: 0, duration: 0.9, ease: "power1.in" }, t + 0.45);
        });
      };
      // a piece of the screen lifts toward the camera; its shadow stays on the glass
      const lift = (card, shadow, t, z = 170, s = 1.06, rx = -5) => {
        tl.set(card, { opacity: 1 }, t);
        tl.fromTo(card, { z: 0, scale: 1, rotationX: 0 }, { z, scale: s, rotationX: rx, duration: 0.6, ease: "back.out(1.7)" }, t);
        tl.fromTo(shadow, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1.04, duration: 0.6, ease: "power2.out" }, t);
      };

      // ---------------------------------------------------------------- background: the lights drift
      document.querySelectorAll(".bk").forEach((b, i) => {
        sway(b, "x", 26 + rnd(i, 2) * 40, 4 + rnd(i, 4) * 3, 0, D, rnd(i, 6) * 6);
        sway(b, "y", 18 + rnd(i, 3) * 34, 5 + rnd(i, 5) * 3, 0, D, rnd(i, 8) * 6);
      });

      // ================================================================ 1. HOOK: only Sunday
      const days = [...document.querySelectorAll(".day")];
      days.forEach((d, i) =>
        tl.fromTo(d, { y: 70, scale: 0.3, opacity: 0, rotation: (i - 3) * 4 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, E.week_in + i * 0.05));
      sway("#week", "rotation", 1.4, 3.6, 0, E.week_out);
      sway("#week", "y", 10, 2.8, 0, E.week_out, 1.2);
      tl.fromTo("#weekw", { scale: 0.92 }, { scale: 1.02, duration: E.w_dim - 0.1, ease: "sine.inOut" }, 0.1);
      // "dimanche": Sunday lights up, the other days fade
      const lit = (i, t, big = 1.12) => {
        const d = days[i];
        tl.fromTo(d.querySelector(".fill"), { scale: 0 }, { scale: 1, duration: 0.38, ease: "back.out(2.4)" }, t);
        tl.fromTo(d.querySelector(".ck path"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.1);
        tl.to(d, { keyframes: [{ scale: big, y: -14, duration: 0.16, ease: "power2.out" }, { scale: 1, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }] }, t);
        tl.fromTo(d.querySelector(".dl"), { color: "#8C847C" }, { color: "#B45F06", duration: 0.2 }, t);
      };
      lit(6, E.w_dim, 1.22);
      tl.fromTo(days[6].querySelector(".hl"), { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, E.w_dim);
      tl.to(days.slice(0, 6), { scale: 0.9, y: 12, duration: 0.3, ease: "power2.out" }, E.w_dim);

      // ================================================================ 2. AVEC RISE: every day
      // the week steps down to make room for the logo, which lights up on "RISE"
      tl.to("#weekw", { y: 380, scale: 0.94, duration: 0.6, ease: "power3.inOut" }, E.splash2 + 0.05);
      tl.fromTo("#splashw", { y: 40 }, { y: 0, duration: 1.2, ease: "power2.out" }, E.splash2);
      sway("#splash2", "y", 6, 2.4, E.splash2, E.week_out + 0.6);
      // "tous les jours": the six other days light up in a wave, each with its flame
      tl.to(days.slice(0, 6), { scale: 1, y: 0, duration: 0.2, ease: "power2.out" }, E.days - 0.1);
      tl.to(days[6].querySelector(".hl"), { opacity: 0, duration: 0.3 }, E.days);
      for (let i = 0; i < 7; i++) {
        const t = E.days + i * 0.07;
        if (i < 6) lit(i, t, 1.14);
        tl.fromTo(days[i].querySelector(".dfl"), { scale: 0, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "back.out(2.6)" }, t + 0.05);
        sway(days[i].querySelector(".dfl"), "scaleY", 0.06, 0.5 + i * 0.03, t + 0.5, E.week_out + 0.5);
      }
      burst("#confA .conf", E.days + 0.5, 540, 1240, 560, 560);
      // out: the week and the logo rise away, the phone rises into frame
      tl.to("#weekw", { y: -420, scale: 0.8, opacity: 0, duration: 0.36, ease: "power3.in" }, E.phone_in + 0.02);
      tl.to("#splashw", { y: -760, scale: 0.85, opacity: 0, duration: 0.36, ease: "power3.in" }, E.phone_in);

      // ================================================================ THE PHONE (one object, never still)
      sway("#phone", "rotationY", 2.6, 4.2, 0, D);
      sway("#phone", "rotationX", 1.7, 5.3, 0, D, 1.1);
      sway("#phone", "y", 12, 3.6, 0, D, 2.0);
      tl.set("#cam", { y: 1700, rotationX: 42, rotationY: -26, rotation: 6, scale: 0.9 }, 0);
      const push3 = Math.max(E.lift_post - 0.12, E.phone_in + 0.6);
      tl.to("#cam", { y: 40, rotationX: 12, rotationY: -20, rotation: -3, scale: 1.0, duration: push3 - E.phone_in, ease: "expo.out" }, E.phone_in);

      // ================================================================ 3. SHARE: a testimony lifts out
      // the camera follows the post as it rises off the feed
      lift("#lf-sarah", "#sh-sarah", E.lift_post, 190, 1.07, -6);
      tl.to("#cam", { y: -430, rotationX: 9, rotationY: -12, rotation: -1.5, scale: 1.17, duration: 0.85, ease: "power3.inOut" }, push3);
      tl.to("#cam", { y: -470, rotationY: -6, rotation: 0, scale: 1.24, duration: Math.max(0.6, E.pray - push3 - 0.85), ease: "sine.inOut" }, push3 + 0.85);
      // "Dieu ... fait": the line is marked; "ta vie": hearts
      tl.fromTo("#mk-sarah", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, E.w_dieu - 0.05);
      document.querySelectorAll("#hearts .heart").forEach((h, i) => {
        const t = E.w_vie + i * 0.06, dx = (rnd(i, 2) - 0.5) * 160, up = 120 + rnd(i, 4) * 160;
        tl.fromTo(h, { x: 0, y: 0, scale: 0.3, opacity: 0 }, { x: dx * 0.5, y: -up * 0.45, scale: 1.1, opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to(h, { x: dx, y: -up, scale: 0.7, opacity: 0, duration: 0.7, ease: "sine.in" }, t + 0.3);
      });

      // ---------------------------------------------------------------- captions: label, then the punch
      document.querySelectorAll(".beat").forEach((b) => {
        const t0 = parseFloat(b.dataset.start), t1 = t0 + parseFloat(b.dataset.duration);
        const s = b.querySelector(".setup");
        if (s) {
          tl.fromTo(s, { scale: 0.55, y: 26, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t0);
          tl.to(s, { y: -30, opacity: 0, duration: 0.12, ease: "power2.in" }, t1 - 0.12);
        }
        b.querySelectorAll(".punch").forEach((p) => {
          const a = parseFloat(p.dataset.t), u = parseFloat(p.dataset.u);
          tl.fromTo(p, { scale: 0.25, rotation: -5, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.38, ease: "back.out(2.6)" }, a);
          tl.to(p, { scale: 1.035, duration: Math.max(0.2, u - a - 0.55), ease: "sine.inOut" }, a + 0.4);
          tl.to(p, { scale: 0.8, opacity: 0, duration: 0.1, ease: "power2.in" }, u - 0.1);
        });
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
