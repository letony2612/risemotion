<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #bfe3f6; }
        .light { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #dusk { visibility: hidden; }
      </style>
      <div id="root" data-composition-id="fond" data-width="1080" data-height="1920">
        <img id="sky" class="light" src="assets/sky.png" alt="" data-layout-allow-overflow />
        <img id="dusk" class="light" src="assets/dusk.png" alt="" data-layout-allow-overflow />
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // both lights drift in together, so a cut changes the light, not the place
        tl.fromTo(".light", { scale: 1 }, { scale: 1.04, duration: 10.3, ease: "none" }, 0);
        // the sky (black words) and dusk (white words), flipped on every card
        tl.set("#dusk", { visibility: "hidden" }, 0.0);
        tl.set("#dusk", { visibility: "visible" }, 0.3);
        tl.set("#dusk", { visibility: "hidden" }, 0.5666666666666667);
        tl.set("#dusk", { visibility: "visible" }, 0.8666666666666667);
        tl.set("#dusk", { visibility: "hidden" }, 1.1666666666666667);
        tl.set("#dusk", { visibility: "hidden" }, 1.4333333333333333);
        tl.set("#dusk", { visibility: "visible" }, 1.7333333333333334);
        tl.set("#dusk", { visibility: "hidden" }, 2.566666666666667);
        tl.set("#dusk", { visibility: "visible" }, 3.433333333333333);
        tl.set("#dusk", { visibility: "hidden" }, 4.0);
        tl.set("#dusk", { visibility: "visible" }, 4.3);
        tl.set("#dusk", { visibility: "hidden" }, 4.566666666666666);
        tl.set("#dusk", { visibility: "visible" }, 4.866666666666666);
        tl.set("#dusk", { visibility: "hidden" }, 5.166666666666667);
        tl.set("#dusk", { visibility: "visible" }, 5.733333333333333);
        tl.set("#dusk", { visibility: "hidden" }, 6.3);
        tl.set("#dusk", { visibility: "visible" }, 6.566666666666666);
        tl.set("#dusk", { visibility: "hidden" }, 6.866666666666666);
        tl.set("#dusk", { visibility: "visible" }, 7.433333333333334);
        tl.set("#dusk", { visibility: "hidden" }, 8.0);
        window.__timelines["fond"] = tl;
      </script>
    </template>
  </body>
</html>
